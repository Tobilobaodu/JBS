name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Dependency advisories are published against versions you already
    # shipped, so this job can start failing on a day nobody pushed.
    # Checking on a schedule is what makes that a report you receive
    # rather than a surprise on your next unrelated commit.
    - cron: "0 3 * * 1"

jobs:
  build:
    name: Build + lint + test
    # Deliberately excludes `npm audit`: this job's red/green should mean
    # "the code is broken / fine". A newly-published advisory against an
    # unchanged dependency is not a code regression, and blocking every
    # push on it is what trained the red X to be ignored.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Build
        run: cd frontend && npm run build
      - name: Bundle size
        run: cd frontend && npm run size
      - name: Lint
        run: cd frontend && npm run lint
      - name: Test
        run: cd frontend && npm test

  audit:
    name: Dependency audit (high/critical)
    # Its own job, so a dependency advisory reports as its own red X
    # instead of failing the build job and hiding whether the code
    # itself is healthy. Still blocking — it just blocks the right thing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Audit (fail on high/critical)
        run: cd frontend && npm audit --audit-level=high

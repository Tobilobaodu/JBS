          type: array
          nullable: true
          description: "Product extension 3 (see 11-product-extensions.md) — synthesised from this draft's match_evidence_items, not a separate generation call. Template-based suggestion text only; never free-form model output describing experience the user doesn't have."
          items:
            type: object
            properties:
              requirementText: { type: string }
              supportLevel: { type: string, enum: [supported, partially_supported, unsupported, contradictory, unclear] }
              suggestion: { type: string }

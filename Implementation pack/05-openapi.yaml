    MatchEvidenceItem:
      type: object
      description: >
        supportLevel: unsupported, contradictory, and unclear are three
        distinct failure modes, not variants of one "not usable" state —
        see 03-data-model.md section on match_evidence_items for the full
        definition of each and what's permitted in generated output.
        None of the three ever trigger fabrication upstream: each is
        surfaced to the user (directly, or via a cover letter question)
        rather than papered over in generation.
      properties:
        id: { type: string, format: uuid }
        requirementText: { type: string }
        requirementType: { type: string, enum: [required, preferred] }
        supportLevel: { type: string, enum: [supported, partially_supported, unsupported, contradictory, unclear] }
        sourceReferences:
          type: array
          items: { type: string, description: "Reference to a cv_experience_items.id, cv_skill_items.id, cv_education_items.id, or cover_letter_answers.id. Empty array only valid when supportLevel is unsupported or unclear. For contradictory, holds the conflicting sources themselves." }


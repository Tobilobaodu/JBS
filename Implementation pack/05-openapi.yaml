        createdAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time, nullable: true }

    AtsReadinessCheck:
      type: object
      description: "Product extension 1 (see 11-product-extensions.md). A rules-based structural check, distinct from the Docling/Textract agreement check in structuralValidation — this evaluates the merged result against known ATS-parsing-hostile patterns."
      properties:
        id: { type: string, format: uuid }
        cvId: { type: string, format: uuid }
        cvProfileVersionId: { type: string, format: uuid }
        overallScore: { type: number, minimum: 0, maximum: 1 }
        contactInfoParseable: { type: boolean }
        checks:
          type: array
          items:
            type: object
            properties:
              checkType: { type: string, enum: [text_in_image, layout_structure, contact_info_location, non_standard_characters, section_heading_recognizability, file_format_signals] }
              passed: { type: boolean }
              severity: { type: string, enum: [low, medium, high] }
              detail: { type: string }
        createdAt: { type: string, format: date-time }
      example:
        id: "ats_check_1"
        cvId: "b3e1f2a0-1234-4c56-8abc-9f0e1d2c3b4a"
        cvProfileVersionId: "5566aabb-1122-4c33-9d44-eeff00112233"
        overallScore: 0.72
        contactInfoParseable: true
        checks:
          - checkType: layout_structure
            passed: false
            severity: high
            detail: "Two-column layout detected in the experience section — reading order may not be preserved by common ATS parsers."
          - checkType: text_in_image
            passed: true
            severity: low
            detail: "No image-embedded text detected."
        createdAt: "2026-08-03T10:15:00Z"


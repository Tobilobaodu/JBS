[alembic]
script_location = alembic
# Put the directory holding alembic.ini on sys.path so env.py can import
# `app`. The `alembic` console script otherwise only sees its own bin dir —
# in-process runs (tests/conftest.py) never noticed, the prod `migrate`
# container did: "ModuleNotFoundError: No module named 'app'".
prepend_sys_path = .
sqlalchemy.url = postgresql://cvapp:cvapp_local@localhost:5432/cv_tailoring

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      clamav:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
    restart: unless-stopped

  # PostgreSQL 15+ with health check per spec
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cvapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvapp_local}
      POSTGRES_DB: ${POSTGRES_DB:-cv_tailoring}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cvapp} -d ${POSTGRES_DB:-cv_tailoring}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Redis for Celery broker and cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # MinIO for S3-compatible local object storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ClamAV for malware scanning
  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Celery worker - Docling extraction
  worker_docling:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.workers.tasks worker -Q docling_extract --concurrency=2 --loglevel=info
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./app:/app/app:ro
    restart: unless-stopped
    # Docling worker: internal-only network — no outbound internet access
    networks:
      - default
      - no_internet

  # Celery worker - Textract enrichment
  worker_textract:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.workers.tasks worker -Q textract_extract --concurrency=2 --loglevel=info
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app:ro
    restart: unless-stopped
    # Textract worker: needs outbound to AWS Textract endpoint only
    networks:
      - default

  # Celery worker - merge and structural validation
  worker_merge:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.workers.tasks worker -Q merge_parse --concurrency=2 --loglevel=info
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:

networks:
  default:
  no_internet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
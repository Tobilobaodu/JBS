services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      clamav:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
    restart: unless-stopped

  # PostgreSQL 15+ with health check per spec
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cvapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvapp_local}
      POSTGRES_DB: ${POSTGRES_DB:-cv_tailoring}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cvapp} -d ${POSTGRES_DB:-cv_tailoring}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Redis for Celery broker and cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # MinIO for S3-compatible local object storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ClamAV for malware scanning
  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Celery worker - Docling extraction
  worker_docling:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.workers.tasks worker -Q docling_extract --concurrency=2 --loglevel=info
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./app:/app/app:ro
    restart: unless-stopped
    # Docling worker: internal-only network — no outbound internet access
    networks:
      - default
      - no_internet

  # Celery worker - Textract enrichment
  worker_textract:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.workers.tasks worker -Q textract_extract --concurrency=2 --loglevel=info
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app:ro
    restart: unless-stopped
    # Textract worker: needs outbound to AWS Textract endpoint only
    networks:
      - default

  # Celery worker - merge and structural validation
  worker_merge:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.workers.tasks worker -Q merge_parse --concurrency=2 --loglevel=info
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app:ro
    restart: unless-stopped

  # Celery worker - job post URL fetch (SSRF-safe, network-isolated)
  worker_job_fetch:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.workers.tasks worker -Q job_post_fetch --concurrency=3 --loglevel=info
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app:ro
    restart: unless-stopped
    # Per 10-security-plan.md §4: network-level egress restriction as the
    # backstop if application-level IP validation has a bypass. This worker
    # needs internal DB/Redis + public internet only — no route to cloud
    # metadata or other internal-only services.
    networks:
      - default

  # Celery worker - job post structuring (rules-based, no LLM needed yet)
  worker_job_parse:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.workers.tasks worker -Q job_post_parse --concurrency=3 --loglevel=info
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app:ro
    restart: unless-stopped

  # Celery worker - match analysis (Phase 3)
  worker_match:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.workers.tasks worker -Q match --concurrency=3 --loglevel=info
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app:ro
    restart: unless-stopped

  # Celery worker - CV structured profile extraction (Phase 2)
  worker_cv_parse:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.workers.tasks worker -Q cv_parse --concurrency=2 --loglevel=info
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app:ro
    restart: unless-stopped
    # CV parse worker: reads from cv_raw_text, writes to profile tables.
    # No outbound network needed — deny-all egress.
    networks:
      - default
      - no_internet

  # Prometheus — scrapes /metrics from the API
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - api
    restart: unless-stopped

  # Grafana — dashboards for Prometheus metrics
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
  prometheus_data:
  grafana_data:

networks:
  default:
  no_internet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
